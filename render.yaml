services:
  - type: web
    name: twitter-api
    runtime: docker
    repo: https://github.com/thanhsonls12/Twitter-API.git
    branch: main
    region: singapore
    plan: free
    numInstances: 1
    autoDeployTrigger: commit
    healthCheckPath: /health/ready
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: '10000'
      - key: BASE_URL
        value: https://twitter-api.sonkma.id.vn
      - key: CLIENT_URL
        value: ''
      - key: CORS_ORIGINS
        value: ''

      - key: MONGO_URI
        sync: false
      - key: DB_NAME
        value: twitter_clone
      - key: USERS_COLLECTION
        value: users
      - key: REFRESH_TOKENS_COLLECTION
        value: refresh_tokens
      - key: FOLLOWS_COLLECTION
        value: follows
      - key: VIDEO_STATUS_COLLECTION
        value: video_status
      - key: TWEETS_COLLECTION
        value: tweets
      - key: HASHTAGS_COLLECTION
        value: hashtags
      - key: BOOKMARKS_COLLECTION
        value: bookmarks
      - key: LIKES_COLLECTION
        value: likes
      - key: CONVERSATIONS_COLLECTION
        value: conversations
      - key: MESSAGES_COLLECTION
        value: messages
      - key: EXPIRE_AFTER_SECONDS
        value: '604800'

      - key: JWT_SECRET_ACCESS_TOKEN
        generateValue: true
      - key: JWT_SECRET_REFRESH_TOKEN
        generateValue: true
      - key: JWT_SECRET_VERIFY_EMAIL_TOKEN
        generateValue: true
      - key: JWT_SECRET_FORGOT_PASSWORD_TOKEN
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRES_IN
        value: 15m
      - key: REFRESH_TOKEN_EXPIRES_IN
        value: 7d
      - key: EMAIL_VERIFY_TOKEN_EXPIRES_IN
        value: 15m
      - key: FORGOT_PASSWORD_TOKEN_EXPIRES_IN
        value: 15m

      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://twitter-api.sonkma.id.vn/users/oauth/google/callback

      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
